# /home/jorgemells/.config/tmuxinator/sec.yml

name: sec
root: ~/Development/uni-semester-projects/sec/

# Optional tmux socket
# socket_name: foo

# Note that the pre and post options have been deprecated and will be replaced by
# project hooks.

# Project hooks

# Runs on project start, always
on_project_start: fusermount -u sec-home; sshfs -p 2222 sec2526@localhost:/home/sec2526 /home/jorgemells/Development/uni-semester-projects/sec/sec-home/ -o cache=yes -o kernel_cache -o compression=no

# Run on project start, the first time
on_project_first_start: mkdir -p ~/Development/uni-semester-projects/sec/

# Run on project start, after the first time
# on_project_restart:

# Run on project exit ( detaching from tmux session )
# on_project_exit: command

# Run on project stop
# on_project_stop: command

# Runs in each window and pane before window/pane specific commands. Useful for setting up interpreter versions.
# pre_window: rbenv shell 2.0.0-p247

# Pass command line options to tmux. Useful for specifying a different tmux.conf.
# tmux_options: -f ~/.tmux.mac.conf

# Change the command to call tmux. This can be used by derivatives/wrappers like byobu.
# tmux_command: byobu

# Specifies (by name or index) which window will be selected on project startup. If not set, the first window is used.
# startup_window: editor

# Specifies (by index) which pane of the specified window will be selected on project startup. If not set, the first pane is used.
# startup_pane: 1

# Controls whether the tmux session should be attached to automatically. Defaults to true.
# attach: false

windows:
  - editor:
      layout: main-vertical
      # Synchronize all panes of this window, can be enabled before or after the pane commands run.
      # 'before' represents legacy functionality and will be deprecated in a future release, in favour of 'after'
      # synchronize: after
      panes:
        - nvim -c "cd sec-home/dev/sec"
  - terminal-1:
  - vm-terminal-1: ssh -t -p 2222 sec2526@localhost "cd /home/sec2526/dev/sec && PROMPT_COMMAND='source sec25venv/bin/activate; unset PROMPT_COMMAND' bash"
  - vm-terminal-2: ssh -t -p 2222 sec2526@localhost "cd /home/sec2526/dev/sec && PROMPT_COMMAND='source sec25venv/bin/activate; unset PROMPT_COMMAND' bash"

# NOTE: you have to ensure that you don't need to use password for logging in. for vm to localhost communication, we're using a reverse ssh shell.
# check chatgpt or stackexchange to see how to do this for gnome boxes. we must do the ssh-copy-id thing from both ends and create a systemd
# don't also forget to use sshfs so that you can easily nvim the project
# service with autossh so that reverse connection never breaks and is always created upon vm startup
